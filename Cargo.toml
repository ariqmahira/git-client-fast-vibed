[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/git-backend",
    "crates/graph",
    "crates/ui",
    "crates/fixtures",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
fgc-core = { path = "crates/core" }
fgc-git-backend = { path = "crates/git-backend" }
fgc-graph = { path = "crates/graph" }
fgc-fixtures = { path = "crates/fixtures" }

# libgit2 is vendored so every platform builds the same engine version.
# No https/ssh features: network ops go through the git CLI (plan §3).
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
memmap2 = "0.9.12"
thiserror = "2.0.21"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.23.0"

[profile.release]
debug = "line-tables-only"

# Benchmarks and the probe should measure optimized code, with symbols for profiling.
[profile.bench]
debug = "line-tables-only"
