name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: linux.git budgets + full criterion run.
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows early: it is usually the slowest platform for status/watcher.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev
      - run: cargo test --workspace
      - run: cargo bench --workspace --no-run

  budgets:
    name: performance budgets (synthetic repos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p fgc-bench -p fgc-fixtures
      - name: Cache generated bench repos
        uses: actions/cache@v4
        with:
          path: bench-repos
          key: bench-repos-${{ runner.os }}-${{ hashFiles('crates/fixtures/**') }}
      - name: Generate bench repos
        run: |
          ./target/release/fgc-fixtures bench-repos small history-200k wide-100k
          # Restoring from the cache changes every file's mtime/inode, which
          # makes the index's stat data stale; refresh it as a user's git would.
          for r in small history-200k wide-100k; do git -C bench-repos/$r update-index -q --refresh || true; done
      - name: Probe budgets
        run: |
          set -euo pipefail
          mkdir -p probe-reports
          P=./target/release/fgc-probe
          $P bench-repos/small --budgets budgets.toml --profile small --json probe-reports/small.json
          $P bench-repos/history-200k --budgets budgets.toml --profile history-200k --json probe-reports/history-200k.json
          $P bench-repos/wide-100k --iters 5 --status-path pkg0050/file0500.txt \
             --watch-path pkg0050/file0500.txt --no-graph \
             --budgets budgets.toml --profile wide-100k --json probe-reports/wide-100k.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-reports-synthetic
          path: probe-reports

  release-build:
    name: build fgc (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, bin: fgc }
          - { os: macos-latest, name: macos-arm64, bin: fgc }
          - { os: windows-latest, name: windows-x86_64, bin: fgc.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev
      - run: cargo build --release -p fgc-ui
      - uses: actions/upload-artifact@v4
        with:
          name: fgc-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}

  ui:
    name: UI budgets (headless GPUI)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages (X11 headers, Xvfb, Mesa software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool x11-utils mesa-vulkan-drivers \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev \
            fonts-dejavu-core fonts-inter
      - run: cargo build --release -p fgc-ui -p fgc-fixtures
      - name: Cache generated bench repos
        uses: actions/cache@v4
        with:
          path: bench-repos
          key: bench-repos-ui-${{ runner.os }}-${{ hashFiles('crates/fixtures/**') }}
      - run: ./target/release/fgc-fixtures bench-repos history-200k diff-5k
      - name: UI benchmark
        run: |
          set -euo pipefail
          mkdir -p ui-reports
          # Warm-up launch: fills Mesa's shader cache (llvmpipe JIT-compiles
          # every pipeline on first use) and the page cache, so first-paint
          # measures the app, not software Vulkan's one-time compile.
          timeout 120 scripts/ui-headless.sh ./target/release/fgc bench-repos/diff-5k --bench --bench-frames 5 --bench-inputs 2 > /dev/null
          for p in history-200k diff-5k; do
            timeout 600 scripts/ui-headless.sh ./target/release/fgc bench-repos/$p --bench \
              --budgets budgets.toml --profile $p --report ui-reports/$p.json
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-reports
          path: ui-reports

  budgets-linux:
    name: performance budgets (linux.git)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p fgc-bench
      - name: Cache linux.git
        uses: actions/cache@v4
        with:
          path: bench-repos/linux.git
          key: linux-git-${{ github.run_id }}
          restore-keys: linux-git-
      - run: scripts/fetch-bench-repos.sh --commit-graph
      - name: Probe budgets
        run: |
          mkdir -p probe-reports
          ./target/release/fgc-probe bench-repos/linux.git --budgets budgets.toml \
            --profile linux --json probe-reports/linux.json
      - name: UI system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool x11-utils mesa-vulkan-drivers \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev \
            fonts-dejavu-core fonts-inter
      - name: UI benchmark (linux.git)
        run: |
          cargo build --release -p fgc-ui
          scripts/ui-headless.sh ./target/release/fgc bench-repos/linux.git --bench \
            --budgets budgets.toml --profile linux --report probe-reports/ui-linux.json
      - name: Criterion (external repo)
        env:
          FGC_BENCH_REPO: ${{ github.workspace }}/bench-repos/linux.git
        run: cargo bench -p fgc-bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-reports-linux
          path: |
            probe-reports
            target/criterion
